name: Bug report
description: Report something that doesn't work the way it should
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in the sections below.
        For security issues, **do not** use this form. See [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I upload a PDF resume in Chinese, the diagnosis report shows...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the bug. A failing test or short script is ideal.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: I expected the diagnosis to complete and show...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error output
      description: Paste the full error stack, console output, or screenshots if relevant.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Frontend (UI / React)
        - PDF parsing
        - V4 diagnosis workflow
        - AI router / providers
        - Async task queue
        - Database / Prisma
        - Corpus content
        - Build / deployment
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit SHA or release tag where the bug occurs. Use `git rev-parse --short HEAD`.
      placeholder: e.g. 1a2b3c4 or main
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser (if frontend), AI provider in use.
      placeholder: macOS 14, Node 20.11, Chrome 124, DEEPSEEK
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — logs, related issues, hypotheses.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true
